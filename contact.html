<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>CONTACTO</title>
    <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
        <div class="logo">
            <span>D.B.</span>
        </div>
        <nav>
            <a href="index.html">Sobre mí</a>
            <a href="aboutme.html">Servicios</a>
            <a href="temple.html">Portafolio</a>
        </nav>
        <div class="hablar">
            <a href="contact.html" class="btn-contact">Contactame</a>
        </div>
    </header>

  <section class="back" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5rem 9%;">
    <div class="contact-section">

      <!-- Formulario a la derecha -->
      <div class="form-box">
        <!-- Reemplaza tu_correo@gmail.com con tu correo real -->
        <form action="https://formsubmit.co/tu_correo@gmail.com" method="POST">
          <h2>Contáctame</h2>
          <div class="input-box">
            <span class="icon"><i class="fas fa-user"></i></span>
            <input type="text" name="Nombre" placeholder="Tu Nombre" required>
          </div>
          <div class="input-box">
            <span class="icon"><i class="fas fa-envelope"></i></span>
            <input type="email" name="Correo" placeholder="Tu Correo" required>
          </div>
          <div class="input-box">
            <span class="icon"><i class="fas fa-comment"></i></span>
            <textarea name="Mensaje" placeholder="Tu Mensaje" required></textarea>
          </div>
          <div class="input-box">
            <input type="submit" value="Enviar">
          </div>
          
          <div class="social-icons">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer>
      <p>&copy; 2026 Damián Borda
          <br>
          Todos los derechos reservados.</p>
  </footer>

</body>
</html>
